<div class="dp-parks-map-wrap" id="dp-parks-map-wrap">
  <style>
    #dp-parks-map-wrap { max-width: 1100px; margin: 0 auto; }
    #dp-parks-map-wrap #dp-parks-map {
      width: 100%;
      height: 550px;
      border-radius: 6px;
      z-index: 0;
    }
    #dp-parks-map-wrap .leaflet-popup-content-wrapper { border-radius: 6px; }
    #dp-parks-map-wrap .dp-parks-popup-title {
      font-weight: 700;
      color: #347743;
      margin: 0 0 4px;
      font-size: 1em;
    }
    #dp-parks-map-wrap .dp-parks-popup-address {
      margin: 0 0 6px;
      color: #333;
      font-size: 0.9em;
      line-height: 1.4;
    }
    #dp-parks-map-wrap .dp-parks-popup-link {
      display: inline-block;
      color: #347743;
      font-weight: 600;
      font-size: 0.9em;
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      #dp-parks-map-wrap #dp-parks-map { height: 420px; }
    }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <div id="dp-parks-map" role="application" aria-label="Interactive map of Dallas Park and Recreation Department parks"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    (function () {
      // Featured Dallas 150 Parks.
      // NOTE: lat/lng below are ESTIMATED from street/neighborhood knowledge,
      // not run through a geocoding service — verify pin placement (e.g. via
      // Google My Maps CSV import) before publishing, especially for the
      // less prominent parks lower in this list.
      // url is optional — the popup link only appears once a real page URL is set.
      var DP_PARKS = [
        { name: "Lake Cliff Park", lat: 32.7458, lng: -96.8144, address: "300 E Colorado Blvd, Dallas, TX 75201", url: "" },
        { name: "Samuell Grand Park", lat: 32.7889, lng: -96.7461, address: "6200 E Grand Ave, Dallas, TX 75223", url: "" },
        { name: "Reverchon Park", lat: 32.8058, lng: -96.8114, address: "3505 Maple Ave, Dallas, TX 75219", url: "" },
        { name: "City Park", lat: 32.7684, lng: -96.7889, address: "1515 S. Harwood St, Dallas, TX 75215", url: "" },
        { name: "Pike Park", lat: 32.7942, lng: -96.8206, address: "2807 Harry Hines Blvd, Dallas, TX 75201", url: "" },
        { name: "Thurgood Marshall Park", lat: 32.6789, lng: -96.8264, address: "5150 Mark Trail Way, Dallas, TX 75232", url: "" },
        { name: "Dallas Zoo", lat: 32.7411, lng: -96.8153, address: "650 S R.L. Thornton Fwy, Dallas, TX 75203", url: "" },
        { name: "Cedar Crest Golf Course", lat: 32.7423, lng: -96.7856, address: "1800 Southerland Ave, Dallas, TX 75203", url: "" },
        { name: "Eloise Lundy Park", lat: 32.7723, lng: -96.8283, address: "1200 Sabine St, Dallas, TX 75203", url: "" },
        { name: "Crawford Park", lat: 32.7398, lng: -96.6822, address: "8700 Elam Rd, Dallas, TX 75217", url: "" },
        { name: "Bachman Lake Park", lat: 32.8496, lng: -96.8613, address: "3500 W Northwest Hwy, Dallas, TX 75220", url: "" },
        { name: "Hattie R. Moore Park", lat: 32.7684, lng: -96.8556, address: "3212 N. Winnetka, Dallas, TX 75212", url: "" },
        { name: "Fair Park", lat: 32.7815, lng: -96.7649, address: "3809 Grand Ave, Dallas, TX 75210", url: "" },
        { name: "Juanita J. Craft Park", lat: 32.7614, lng: -96.7719, address: "4352 Spring Ave, Dallas, TX 75210", url: "" },
        { name: "Singing Hills Park", lat: 32.6934, lng: -96.7997, address: "1919 Crouch Rd, Dallas, TX 75241", url: "" },
        { name: "Kleberg Park", lat: 32.6858, lng: -96.6386, address: "1575 Edd Rd, Dallas, TX 75253", url: "" },
        { name: "Miller Family Park", lat: 32.6975, lng: -96.7930, address: "2814 Persimmon Rd, Dallas, TX 75241", url: "" },
        { name: "White Rock Lake Park", lat: 32.8343, lng: -96.7208, address: "E Lawther Dr, Dallas, TX 75218", url: "" },
        { name: "Hamilton Park", lat: 32.9013, lng: -96.7683, address: "12225 Willowdell Dr, Dallas, TX 75243", url: "" },
        { name: "Fretz Park", lat: 32.9394, lng: -96.7994, address: "6994 Belt Line Rd, Dallas, TX 75254", url: "" },
        { name: "Campbell Green Park", lat: 32.9884, lng: -96.8022, address: "16600 Hillcrest Rd, Dallas, TX 75248", url: "" },
        { name: "Marcus Park", lat: 32.8664, lng: -96.8697, address: "3000 Modella Ave, Dallas, TX 75229", url: "" },
        { name: "Tietze Park", lat: 32.8078, lng: -96.7625, address: "2700 Skillman St, Dallas, TX 75214", url: "" },
        { name: "Freedman’s Cemetery", lat: 32.8028, lng: -96.7961, address: "2521 N Central Expy, Dallas, TX 75204", url: "" },
        { name: "Klyde Warren Park", lat: 32.7889, lng: -96.8025, address: "2012 Woodall Rodgers Fwy, Dallas, TX 75201", url: "" }
      ];

      var map = L.map("dp-parks-map", { scrollWheelZoom: false });

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      var markers = [];
      DP_PARKS.forEach(function (park) {
        var popupHtml = '<div class="dp-parks-popup-title">' + park.name + '</div>';
        if (park.address) {
          popupHtml += '<p class="dp-parks-popup-address">' + park.address + '</p>';
        }
        if (park.url) {
          popupHtml += '<a class="dp-parks-popup-link" href="' + park.url + '">View park page</a>';
        }
        var marker = L.marker([park.lat, park.lng]).bindPopup(popupHtml);
        marker.addTo(map);
        markers.push(marker);
      });

      if (markers.length) {
        var group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.15));
      } else {
        map.setView([32.7767, -96.7970], 11);
      }

      map.on("focus", function () { map.scrollWheelZoom.enable(); });
      map.on("blur", function () { map.scrollWheelZoom.disable(); });
    })();
  </script>
</div>
