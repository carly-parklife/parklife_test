<div class="cpg-gallery" id="cpg-gallery">
  <style>
    #cpg-gallery { max-width: 1100px; margin: 0 auto; }
    #cpg-gallery .cpg-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    #cpg-gallery .cpg-thumb-link { display: block; overflow: hidden; border-radius: 6px; }
    #cpg-gallery .cpg-thumb {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
      cursor: zoom-in;
    }
    #cpg-gallery .cpg-thumb-link:hover .cpg-thumb { transform: scale(1.06); }
    #cpg-gallery .cpg-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    #cpg-gallery .cpg-overlay:target { display: flex; }
    #cpg-gallery .cpg-overlay-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
    }
    #cpg-gallery .cpg-overlay-inner {
      position: relative;
      max-width: 92vw;
      max-height: 92vh;
      z-index: 1;
    }
    #cpg-gallery .cpg-overlay-img {
      max-width: 92vw;
      max-height: 92vh;
      display: block;
      border-radius: 4px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    #cpg-gallery .cpg-close-btn {
      position: absolute;
      top: -18px;
      right: -18px;
      width: 36px;
      height: 36px;
      background: #fff;
      color: #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    @media (max-width: 900px) {
      #cpg-gallery .cpg-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      #cpg-gallery .cpg-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      #cpg-gallery .cpg-thumb { height: 120px; }
      #cpg-gallery .cpg-close-btn { top: 8px; right: 8px; }
    }
  </style>
